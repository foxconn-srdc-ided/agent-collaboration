name: Agent handoff
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Explicit start or resume after tool failure
        required: true
        type: choice
        options: [start, resume, retry_invalid_amend, grant_a_fix]
      human:
        description: GitHub username of human acceptor
        required: false
        default: ycliu-dev
        type: string
      run_id:
        description: Existing run ID for resume
        required: false
        type: string
  repository_dispatch:
    types: [agent-report]
  issue_comment:
    types: [created]
  issues:
    types: [closed]
jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: poc-state
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: poc-state
          path: .state
          persist-credentials: false
      - name: Route controlled event
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: python3 controller.py
